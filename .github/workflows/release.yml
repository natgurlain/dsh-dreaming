name: Release

# Push a tag vX.Y.Z whose version matches package.json. The build job packs the
# plugin with a read-only token; the publish job, which runs no repository
# code, attaches the tarball to a GitHub Release; the npm job publishes that
# same tarball by trusted publishing (no npm token is stored anywhere).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  PACKAGE: '@natgurlain/dsh-dreaming'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: The tag must match package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG does not match package.json version $version"; exit 1; }
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: Pack the plugin
        run: |
          mkdir release
          pnpm pack --pack-destination release
          mv release/*.tgz "release/dsh-dreaming-plugin-$TAG.tgz"
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*
            exit 0
          fi
          flags=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* "${flags[@]}"

  # Trusted publishing: on npmjs.com the package names this repository and
  # release.yml as its trusted publisher. Re-runnable; skips a version npm has.
  npm:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download the released tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --dir release --pattern "dsh-dreaming-plugin-$TAG.tgz" --pattern SHA256SUMS
      - name: Verify its checksum
        working-directory: release
        run: sha256sum -c --ignore-missing SHA256SUMS
      - name: Publish to npm
        run: |
          version="${TAG#v}"
          tarball="./release/dsh-dreaming-plugin-$TAG.tgz"
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is too old for trusted publishing (needs 11.5.1)"
            exit 1
          fi
          packed="$(tar -xzOf "$tarball" package/package.json | node -e 'const m = JSON.parse(require("node:fs").readFileSync(0, "utf8")); console.log(`${m.name}@${m.version}`)')"
          [ "$packed" = "$PACKAGE@$version" ] || { echo "::error::$tarball holds $packed, expected $PACKAGE@$version"; exit 1; }
          if [ "$(npm view "$PACKAGE@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$PACKAGE@$version is already on npm"
            exit 0
          fi
          npm publish "$tarball" --access public --ignore-scripts
